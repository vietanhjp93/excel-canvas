# Publish packages to npm on every push to main/master/add-feature
name: Publish to NPM

on:
    push:
        branches:
            - main
            - master
            - add-feature
permissions:
    id-token: write # Required for OIDC
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: npm-publish # Uncomment if you create this environment in GitHub repo settings

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  registry-url: "https://registry.npmjs.org"

            - name: Install dependencies
              run: npm install

            - name: Build all packages
              run: npm run build

            - name: Install latest npm (required for OIDC trusted publishing)
              run: npm install -g npm@latest

            - name: Check npm version
              run: npm --version

            - name: Publish excel-canvas (core)
              working-directory: ./packages/core
              run: |
                  echo "📦 Publishing excel-canvas..."
                  npm publish --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Publish excel-canvas-cells
              working-directory: ./packages/cells
              run: |
                  echo "📦 Publishing excel-canvas-cells..."
                  npm publish --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Publish excel-canvas-source
              working-directory: ./packages/source
              run: |
                  echo "📦 Publishing excel-canvas-source..."
                  npm publish --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Summary
              run: |
                  echo "## 📋 Publish Summary" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "✅ Successfully published packages:" >> $GITHUB_STEP_SUMMARY
                  echo "- [excel-canvas](https://www.npmjs.com/package/excel-canvas)" >> $GITHUB_STEP_SUMMARY
                  echo "- [excel-canvas-cells](https://www.npmjs.com/package/excel-canvas-cells)" >> $GITHUB_STEP_SUMMARY
                  echo "- [excel-canvas-source](https://www.npmjs.com/package/excel-canvas-source)" >> $GITHUB_STEP_SUMMARY
