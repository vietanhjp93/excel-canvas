# Publish packages to npm on every push to main/master/add-feature
name: Publish to NPM

on:
    push:
        branches:
            - main
            - master
            - add-feature
permissions:
    id-token: write # Required for OIDC
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  registry-url: "https://registry.npmjs.org"

            # Ensure npm 11.5.1 or later is installed
            - run: npm install -g npm@latest
            - run: npm ci
            - run: npm run build

            - name: Check npm version
              run: npm --version

            - name: Publish excel-canvas (core)
              working-directory: ./packages/core
              run: |
                  echo "📦 Publishing excel-canvas..."
                  npm publish

            - name: Publish excel-canvas-cells
              working-directory: ./packages/cells
              run: |
                  echo "📦 Publishing excel-canvas-cells..."
                  npm publish

            - name: Publish excel-canvas-source
              working-directory: ./packages/source
              run: |
                  echo "📦 Publishing excel-canvas-source..."
                  npm publish
